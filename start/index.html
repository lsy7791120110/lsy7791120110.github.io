:root{color-scheme:dark;--navy:#203749;--cream:#f6f2e9;--muted:#b6c3cb;--line:#526574;--ink:#253d4d}

.group-heading::after{content:"";height:1px;flex:1;background:var(--line)}
.links{display:grid;gap:12px}
.entry{display:grid;grid-template-columns:1fr 24px;align-items:center;gap:14px;min-height:91px;padding:20px 24px;background:var(--cream);border:1px solid var(--cream);border-radius:3px;color:var(--ink);text-decoration:none;transition:background .16s,transform .16s}
.entry b{display:block;font-size:18px;line-height:1.5;font-weight:600;letter-spacing:-.035em}
.entry small{display:block;margin-top:4px;color:#61707a;font-size:12px;line-height:1.65}
.arrow{justify-self:end;font-family:system-ui,sans-serif;font-size:23px;line-height:1;color:#6d818e}
.entry.featured{background:#dfe9ed;border-color:#dfe9ed}
.entry.featured small{color:#4d6573}
.portfolio{display:grid;grid-template-columns:1fr 67px;gap:8px}
.portfolio .entry{padding-right:18px}
.language{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:transparent;border:1px solid #82939f;border-radius:3px;color:var(--cream);text-decoration:none;font-size:14px;min-height:91px}
.language small{font-size:10px;color:var(--muted)}
.badge{display:inline-block;margin-left:8px;border:1px solid #c6cdd0;border-radius:3px;padding:1px 5px;vertical-align:middle;color:#667581;font-size:10px;font-weight:400;line-height:1.6;letter-spacing:0}
footer{text-align:center;border-top:1px solid var(--line);padding:22px 0 0;color:var(--muted);font-size:11px;line-height:1.9}
footer p{margin:0 0 7px}
footer .name{color:#d2d9dc;font-size:10px;letter-spacing:.16em}
a:focus-visible{outline:3px solid #edc8a8;outline-offset:4px}
@media(hover:hover){.entry:hover{background:#fffaf0;transform:translateY(-2px)}.entry.featured:hover{background:#edf4f6}.language:hover{background:#314b5f}}
@media(min-width:1000px){main{padding-top:76px}header{padding-bottom:44px}h1{font-size:42px}}
@media(max-width:420px){main{width:calc(100% - 32px);padding-top:40px}header{padding-bottom:30px}h1{font-size:32px;margin-top:16px}header p{font-size:12px}.entry{padding:18px;min-height:88px;gap:8px}.entry b{font-size:16px}.entry small{font-size:11px}.portfolio{grid-template-columns:1fr 60px}.language{min-height:88px}.badge{font-size:9px;margin-left:5px}}
@media(prefers-reduced-motion:reduce){.entry{transition:none}}
</style>
