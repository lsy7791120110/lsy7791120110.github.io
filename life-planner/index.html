function numberBox(id,label,min=0,max='',step='any'){
 return '<label class="field"><span>'+E(label)+'</span><input type="number" min="'+min+'" '+(max!==''?'max="'+max+'"':'')+' step="'+step+'" data-field="'+id+'" value="'+E(f(id))+'"></label>';

function selectBox(id,label,options){

function areaView(n){

function pointOnSpiral(t){const a=t*Math.PI*6-Math.PI/2,r=107*t;return [150+r*Math.cos(a),150+r*Math.sin(a)]}

 const k='point.'+i+'.';

 return pointOnSpiral(Math.min(.98,.055+i*.094));
}

 const options=Array.from({length:count},(_,i)=>'<option value="'+i+'" '+(i===selectedPoint?'selected':'')+'>'+(i+1)+'. '+E(f('point.'+i+'.name')||'새 대상')+'</option>').join('');
 const outside=Math.hypot(pos[0]-150,pos[1]-150)>111;
 const previous=[0,1,2,3].filter(i=>f('ring'+i));
 return '<div class="spiral-layout"><div><svg id="spiral-map" viewBox="0 0 300 300" aria-label="선택한 대상의 위치를 누르는 나선 지도"><rect width="300" height="300" rx="18" fill="#faf3ed"/><circle cx="150" cy="150" r="112" fill="#f2ecf8" stroke="#b9a9bd" stroke-dasharray="3 4"/><path d="'+line+'" fill="none" stroke="#a38cae" stroke-width="1.7"/><text x="15" y="23">경계 밖 · 멀리 둘 것</text>'+markers+'</svg><p class="sub">선택한 대상의 위치를 그림에서 눌러 옮길 수 있어요.</p></div><div><label class="field"><span>편집할 대상</span><select id="point-select">'+options+'</select></label>'+field(k+'name','대상 이름','',true)+field(k+'axis','직접 정한 분류','사람, 취향, 장소 등',true)+'<div class="controls"><button data-place="center">중심 가까이</button><button data-place="edge">가장자리</button><button data-place="outside">경계 밖</button></div><small>현재 위치　'+(outside?'경계 밖':'나선 안')+'</small><p><button class="plain" data-more="point">＋ 대상 추가</button></p></div></div>'+
 (previous.length?'<details class="fold"><summary>기존에 적은 답</summary>'+previous.map(i=>field('ring'+i,rings[i])).join('')+'</details>':'');
}

const initial=()=>({fields:{},interest:[],prior:[],six:[],three:[],custom:[],extra:[],last:'direction/0'});

const yearKey=y=>'orbit-journal-'+y+'-v1';

let year=defaultYear;
function loadYear(y){
  const raw=localStorage.getItem(yearKey(y));

  const result=JSON.parse(raw);
  if(!valid(result))throw Error('invalid record');
  return result;
}

function refreshYears(){
  const found=new Set([year,defaultYear]);
  try{for(let i=0;i<localStorage.length;i++){
    const hit=/^orbit-journal-([1-9][0-9]{3})-v1$/.exec(localStorage.key(i));
    if(hit)found.add(Number(hit[1]));
  }}catch{}
  $('#years').replaceChildren(...[...found].sort((a,b)=>a-b).map(y=>new Option(y+'년',y)),new Option('＋ 다른 연도 열기','new'));

  chapters[4][4][2]='다시 '+year+'년으로';
}
function activate(y,replacement){

  try{
    const next=replacement||loadYear(y);
    localStorage.setItem(yearKey(y),JSON.stringify(next));
    localStorage.setItem('orbit-active-year',String(y));
    data=next;year=y;readable=true;saveOK=true;
    selectedPoint=selectedArea=calendarOffset=ring=era=story=person=bucket=0;
    refreshYears();location.hash='home';render();window.scrollTo(0,0);
    $('#save').textContent=y+'년 기록 열림';

const chipbox=(k,arr)=>'<div class="chips">'+arr.map(v=>chip(k,v)).join('')+'</div>';
const counts=k=>data[k].length+' / '+({prior:9,six:6,three:3}[k]);
const sky='<svg class="sky" viewBox="0 0 360 240" aria-hidden="true"><g fill="none" stroke="#aaa0bd" opacity=".64" transform="rotate(-27 220 120)"><ellipse cx="220" cy="120" rx="140" ry="60"/><ellipse cx="220" cy="120" rx="166" ry="82" stroke-dasharray="2 6"/><ellipse cx="220" cy="120" rx="110" ry="40"/></g><g fill="#e4cfa5"><path d="M228 80q2 21 19 23-17 3-19 23-3-20-21-23 18-3 21-23Z"/><circle cx="95" cy="153" r="5"/><circle cx="290" cy="52" r="3"/><circle cx="142" cy="43" r="2"/><circle cx="269" cy="162" r="2"/><path d="m307 184 2 6 6 2-6 2-2 6-2-6-6-2 6-2Z"/></g></svg>';
function route(){const [id,n]=location.hash.slice(1).split('/'),ch=chapters.find(c=>c[0]===id);return ch?[ch,Math.min(Math.max(parseInt(n)||0,0),ch[4].length-1)]:[null,0]}
function home(){
 const list=[0,1,2].map(i=>f('goal'+i)).filter(x=>x.trim());
 const resume=typeof data.last==='string'&&chapters.some(c=>data.last?.startsWith(c[0]+'/'))?data.last:'direction/0';
 const started=Object.values(data.fields).some(x=>x.trim())||data.interest.length;
 return '<section class="hero">'+sky+'<div class="micro">ANNUAL WORKBOOK</div><div class="year">'+year+'</div><h1>LIFE PLANNER</h1><p>내가 아끼는 것부터 올해 실천할 일까지.</p><a class="btn" href="#'+E(resume)+'">'+(started?'이어서 쓰기':'첫 기록 시작하기')+'　→</a></section><div class="headrow"><h2>올해의 나</h2><small>한눈에 보기</small></div><div class="summary"><div><span class="label">나의 목적</span><strong>'+E(f('purpose')||'어떤 사람에게 힘이 되고 싶나요?')+'</strong><div>'+(data.three.length?data.three.map(v=>'<span class="coretag">'+E(v)+'</span>').join(''):'<a class="sub" href="#core/0">나의 핵심가치 고르기　↗</a>')+'</div></div><div><span class="label">버킷리스트</span>'+(list.length?'<ul>'+list.map(v=>'<li>'+E(v)+'</li>').join('')+'</ul>':'<strong>올해 꼭 해보고 싶은 일은?</strong><a class="sub" href="#dreams/0">버킷리스트 쓰기　↗</a>')+'</div></div>'+(f('tagline')?'<p class="sub">미래의 나　'+E(f('tagline'))+'</p>':'')+'<div class="quicklinks"><a href="#calendar">3개년 달력 ↗</a><a href="#statement/1">올해의 선언문 ↗</a></div><div class="home-index"><div class="headrow"><h2>기록 목차</h2><small>09 CHAPTERS</small></div><div class="chapters">'+chapters.map((c,i)=>'<a class="card" href="#'+c[0]+'/0"><span class="icon">'+c[1]+'</span><div><span class="num">0'+(i+1)+'</span><b>'+c[2]+'</b><small>'+c[3]+'</small></div><span class="arrow">›</span></a>').join('')+'</div></div><details class="tools"><summary>기록 보관 및 기기 이동</summary><p>답은 지금 쓰는 브라우저에 저장돼요. 다른 기기나 사이트로 옮길 때는 연도별 백업을 내려받아 새 주소에서 불러오세요.</p><button class="plain" data-act="backup">'+year+'년 백업 내려받기</button><label class="plain">백업 불러오기<input type="file" id="restore" accept=".json,application/json"></label></details>'
}
const rings=['가장 소중한 것','가까이 두고 싶은 것','그다음으로 좋아하는 것','멀리 두고 싶은 것'];
const scenes=['배움과 성장','마음과 신념','관계','재산과 부','시간관리','일과 업적','건강','즐거움과 취미'];
const prompts=['무엇을 배우며 달라졌나요?','어떤 믿음으로 마음을 지켜왔나요?','누구와 어떤 시간을 쌓았나요?','무엇을 마련해 어떻게 썼나요?','무엇에 기꺼이 시간을 내주었나요?','어떤 일을 해냈고 무엇을 남겼나요?','몸과 마음을 어떻게 돌봤나요?','어떤 순간이 가장 즐거웠나요?'];
function content(id,n){
 if(['review','areas','plan','statement'].includes(id))return annualContent(id,n);
 if(id==='direction'){
 if(!n)return panel('내가 힘이 되고 싶은 사람',field('who','누구를 떠올렸나요?','한 사람이나 집단을 떠올려 보세요.')+field('give','그 사람에게 무엇을 전하고 싶나요?')+field('purpose','나의 목적을 한 문장으로','나는 …에게 …을 전하는 사람이고 싶다.'));
 if(n===1)return panel('내가 좋아하는 세계',spiralView(),'가장 좋아하는 대상은 중심 가까이에, 덜 좋아하는 대상은 바깥쪽에 놓으세요. 싫어하는 대상은 경계 밖에 둘 수 있어요.')+panel('그 안에서 찾은 가치',field('likeValue','좋아하는 것들에서 발견한 가치는?','여러 가치는 쉼표로 구분해요.')+field('dislikeValue','멀리 두고 싶은 것은 나의 어떤 가치를 해치나요?','여러 가치는 쉼표로 구분해요.'));
 return panel('내가 존경하는 사람',toggle('person',['첫 번째','두 번째','세 번째'],person)+field('person'+person,'누구인가요?','이름 또는 나와의 관계',true)+field('why'+person,'어떤 말이나 행동이 기억에 남나요?')+field('pv'+person,'그 모습에서 찾은 가치는?','예를 들면 배려, 성실',true),'가까이에서 만난 사람도 좋아요.')
 }
 if(id==='values'){
 if(n)return panel('우선 가치　'+counts('prior'),data.interest.length?chipbox('prior',data.interest):'<a class="btn" href="#values/0">관심 있는 단어 고르기　→</a>','앞에서 표시한 단어 중 특히 소중한 아홉 가지를 골라요.');
 return panel('마음이 가는 단어',Object.entries(GROUPS).map(([g,vs])=>'<h3 class="chiptitle">'+g+'</h3>'+chipbox('interest',vs)).join('')+'<h3 class="chiptitle">내가 더한 단어　'+data.custom.length+' / 8</h3>'+chipbox('interest',data.custom)+addbox('custom'),'좋아하는 단어를 가볍게 눌러 보세요. 한 번 더 누르면 선택이 풀려요.')
 }
 if(id==='core'){
 if(n===0){
   const terms=keys=>[...new Set(keys.flatMap(k=>f(k).split(/[,，、;·\n]+/).map(v=>v.trim()).filter(Boolean)))];
   const sets=[
     ['좋아하는 세계',terms(['likeValue','dislikeValue']),'direction/1'],
     ['가치 목록의 우선 9개',data.prior,'values/1'],
     ['존경하는 사람',terms(['pv0','pv1','pv2']),'direction/2']
   ];
   const seen=new Set(sets.flatMap(x=>x[1]));
   const other=[...new Set([...data.extra,...data.six])].filter(v=>!seen.has(v));
   const choices=sets.map(([title,items,link])=>'<div class="sourcegroup"><h3>'+title+'</h3>'+(items.length?chipbox('six',items):'<a href="#'+link+'">가치 찾으러 가기　↗</a>')+'</div>').join('');
   return panel('남기고 싶은 여섯 가지　'+counts('six'),'<div class="sources">'+choices+'</div><h3 class="chiptitle">내 표현 더하기</h3>'+chipbox('six',other)+addbox('extra'),'세 곳에서 찾은 가치를 비교하고, 남길 단어를 눌러요.');
 }
 return panel('나의 핵심가치　'+counts('three'),(data.six.length?chipbox('three',data.six):'<a class="btn" href="#core/0">후보 고르기　→</a>')+data.three.map(v=>field('meaning:'+v,v+'  ·  내 삶에서 어떤 뜻인가요?')).join(''),'끝까지 지키고 싶은 세 가지를 고르세요.')
 }
 if(id==='dreams'){
 if(!n)return panel(year+'년 12월의 나',field('vision','어떤 하루를 보내고 싶나요?'))+panel('올해의 버킷리스트',toggle('bucket',['버킷 01','버킷 02','버킷 03'],bucket)+field('goal'+bucket,'꼭 해보고 싶은 일은?','하고 싶은 일 한 가지')+field('due'+bucket,'언제까지 어떤 모습이면 이뤘다고 느낄까요?'));
 return panel('더 먼 미래',toggle('era',['3년 이내','5년 이내','10년 이내','언젠가'],era)+field('vision'+era,'어떤 삶을 살고 싶나요?')+field('plan'+era,'무엇을 언제까지 이루고 싶나요?'),'오늘을 기준으로 떠올려 보세요.')
 }
 if(!n)return panel('미래의 내가 쓴 책',field('book','자서전 제목','나의 이야기에 제목을 붙인다면',true)+field('tagline','그때의 나를 표현하는 한마디')+field('author','지은이','이름 또는 필명',true));
 if(n===1)return panel('내가 살아온 장면들',toggle('story',scenes,story)+field('scene'+story,prompts[story],'원하는 삶을 살았다고 상상하며 써보세요.'));
 return panel('다시 '+year+'년으로',field('revise','이 삶에 가까워지려면 어떤 목표를 바꾸고 싶나요?')+'<p><a href="#dreams/0">올해의 버킷리스트 다시 보기　↗</a></p>')
}
function addbox(k){return '<div class="inline" style="margin-top:12px"><input id="newword" aria-label="내 가치 단어" maxlength="30" placeholder="내 가치 단어"><button class="plain" data-act="add" data-key="'+k+'">추가</button></div>'}
function render(){const [c,n]=route();
 $('#sidebar').innerHTML='<span class="micro">ANNUAL JOURNAL</span><div class="sideyear">'+year+'<small>나의 기록장</small></div><nav><a href="#home" '+(!c?'aria-current="page"':'')+'>✦　한눈에 보기</a>'+chapters.map((ch,i)=>'<a href="#'+ch[0]+'/0" '+(ch===c?'aria-current="page"':'')+'><span>0'+(i+1)+'</span>'+ch[2]+'</a>').join('')+'</nav><div class="refnote"><span class="micro">WORKBOOK</span><br><a href="#calendar">3개년 달력　↗</a></div>';
 app.classList.toggle('homeview',!c);document.body.classList.toggle('print-statement',c?.[0]==='statement'&&n===1);if(!c){app.innerHTML=location.hash==='#calendar'?calendarView():home();return}data.last=c[0]+'/'+n;const idx=chapters.indexOf(c),next=({'direction/1':'values/0','values/1':'direction/2','direction/2':'core/0'})[c[0]+'/'+n]||(n<c[4].length-1?c[0]+'/'+(n+1):idx<chapters.length-1?chapters[idx+1][0]+'/0':'home');
 app.innerHTML='<div class="backrow"><a href="#home">← 한눈에 보기</a><span class="num">CHAPTER　0'+(idx+1)+' / 09</span></div><div class="bookhead"><h1>'+c[2]+'</h1><p>'+c[3]+'</p></div><nav class="tabs" aria-label="기록 단계">'+c[4].map((t,i)=>'<button class="'+(i===n?'active':'')+'" data-hash="'+c[0]+'/'+i+'">'+t+'</button>').join('')+'</nav>'+content(c[0],n)+'<div class="footnav"><a class="btn" href="#home">목차</a><a class="btn" href="#'+next+'">'+(next==='home'?'나의 기록 보기':'다음 단계')+'　→</a></div>'
 updateTotals();
}
function switchWord(k,v){const arr=data[k],max={prior:9,six:6,three:3}[k];if(arr.includes(v)){data[k]=arr.filter(w=>w!==v);if(k==='interest')data.prior=data.prior.filter(w=>w!==v);if(k==='six')data.three=data.three.filter(w=>w!==v)}else{if(max&&arr.length>=max){notice(max+'개까지 고를 수 있어요. 다른 단어를 먼저 해제해 주세요.');return}arr.push(v)}persist();render()}
app.addEventListener('input',e=>{if(e.target.dataset.field){data.fields[e.target.dataset.field]=e.target.value;persist();updateTotals();if(e.target.dataset.field==='point.'+selectedPoint+'.name'&&$('#point-select'))$('#point-select').selectedOptions[0].textContent=(selectedPoint+1)+'. '+(e.target.value||'새 대상')}});
app.addEventListener('click',e=>{if(annualClick(e))return;const t=e.target.closest('[data-act],[data-list],[data-hash]');if(!t)return;const d=t.dataset;
 if(d.hash){location.hash=d.hash;return}if(d.list){switchWord(d.list,d.word);return}
 if(d.act==='backup'){const u=URL.createObjectURL(new Blob([JSON.stringify({format:'orbit-annual-v1',year,data},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='LIFE-PLANNER-'+year+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}
 if(d.act==='add'){const v=$('#newword').value.trim();if(!v)return;const k=d.key;if(k==='custom'&&(data.custom.length>=8||Object.values(GROUPS).flat().includes(v))){notice('이미 목록에 있거나 추가 가능한 여덟 칸이 찼어요.');return}if(!data[k].includes(v))data[k].push(v);if(k==='custom'&&!data.interest.includes(v))data.interest.push(v);if(k==='extra'&&data.six.length<6&&!data.six.includes(v))data.six.push(v);persist();render();return}
 const i=Number(d.index);if(d.act==='reviewArea')selectedArea=i;if(d.act==='calYear')calendarOffset=i-1;if(d.act==='ring')ring=i;if(d.act==='bucket')bucket=i;if(d.act==='person')person=i;if(d.act==='era')era=i;if(d.act==='story')story=i;render()
});
app.addEventListener('keydown',e=>{if(e.target.matches('.orb [role=button]')&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}if(e.target.id==='newword'&&e.key==='Enter')app.querySelector('[data-act=add]').click()});
app.addEventListener('change',async e=>{if(e.target.id==='point-select'){selectedPoint=Number(e.target.value);render();return}if(e.target.id!=='restore'||!e.target.files[0])return;try{const x=JSON.parse(await e.target.files[0].text());const target=x.format==='orbit2027'?defaultYear:x.year;if(!['orbit2027','orbit-annual-v1'].includes(x.format)||!yearOK(target)||!valid(x.data))throw Error();if(!confirm(target+'년 기록을 이 백업 파일의 내용으로 바꿀까요?'))return;activate(target,x.data)}catch{notice('이 플래너에서 내보낸 백업 파일을 골라 주세요.')}finally{e.target.value=''}});
$('#years').addEventListener('change',e=>{
  if(e.target.value!=='new'){activate(Number(e.target.value));return}
  e.target.value=year;$('#newyear').value=Math.min(year+1,9999);$('#year-dialog').showModal();$('#newyear').select()
});
$('#cancel-year').onclick=()=>$('#year-dialog').close();
$('#year-form').onsubmit=e=>{e.preventDefault();const y=Number($('#newyear').value);if(yearOK(y)){$('#year-dialog').close();activate(y)}};
window.addEventListener('storage',e=>{if(e.key===yearKey(year)&&e.newValue){try{const updated=JSON.parse(e.newValue);if(valid(updated)){data=updated;render()}}catch{}}});
window.addEventListener('hashchange',()=>{render();if(route()[0])persist();window.scrollTo(0,0)});
refreshYears();render()

</script></body></html>
